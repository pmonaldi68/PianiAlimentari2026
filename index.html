<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piani Alimentari 2026</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 24px; background:#f7f7fb; color:#222; }
      .card { background:#fff; border-radius:12px; padding:20px; box-shadow:0 2px 10px rgba(0,0,0,.08); max-width:1000px; margin:auto; }
      h1 { margin-top:0; }
      .controls { display:flex; gap:12px; flex-wrap:wrap; margin-bottom:16px; }
      select { padding:8px; border-radius:8px; border:1px solid #ccc; }
      .grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); gap:12px; }
      .meal { border:1px solid #e6e6ee; border-radius:10px; padding:10px; background:#fafaff; }
      .meal h3 { margin:0 0 6px; font-size:1rem; }
      ul { margin:0; padding-left:18px; }
      .meta { color:#555; margin-bottom:16px; }
      .error { color:#b00020; font-weight:bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Piani Alimentari 2026</h1>
      <p class="meta" id="patientMeta">Caricamento dati...</p>
      <div class="controls">
        <label>Paziente: <select id="patientSelect"></select></label>
        <label>Giorno: <select id="daySelect"></select></label>
      </div>
      <div id="error" class="error" hidden></div>
      <div class="grid" id="meals"></div>
    </div>

    <script src="app.js"></script>
  </body>
</html>

<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>Piani Alimentari 2026</title>
    <style>
      :root {
        --bg: #f3f6fb;
        --surface: #ffffff;
        --surface-2: #f8faff;
        --text: #1f2937;
        --muted: #5b6472;
        --border: #e5eaf3;
        --primary: #3b82f6;
        --primary-2: #1d4ed8;
        --danger: #b00020;
        --shadow: 0 12px 32px rgba(21, 31, 54, 0.12);
      }

      html[data-theme='dark'] {
        --bg: #0e1117;
        --surface: #171c26;
        --surface-2: #1c2330;
        --text: #e8ecf3;
        --muted: #a9b3c4;
        --border: #2b3444;
        --primary: #60a5fa;
        --primary-2: #93c5fd;
        --danger: #ff7a7a;
        --shadow: 0 16px 38px rgba(0, 0, 0, 0.45);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        color: var(--text);
        background: radial-gradient(circle at top left, #dbeafe 0%, var(--bg) 35%);
        min-height: 100vh;
        transition: background .25s ease, color .25s ease;
      }

      html[data-theme='dark'] body {
        background: radial-gradient(circle at top left, #1d2533 0%, var(--bg) 35%);
      }

      .container { width: min(1100px, 100% - 1rem); margin: 1rem auto; }
      .shell {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: clamp(1rem, 2vw, 1.5rem);
        box-shadow: var(--shadow);
      }

      .topbar {
        display: flex;
        align-items: start;
        justify-content: space-between;
        gap: 1rem;
        flex-wrap: wrap;
        margin-bottom: 1rem;
      }

      h1 { margin: 0; font-size: clamp(1.25rem, 3vw, 1.9rem); }
      .subtitle { margin: .35rem 0 0; color: var(--muted); font-size: .95rem; }

      .theme-toggle {
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        border-radius: 999px;
        padding: .55rem .9rem;
        cursor: pointer;
        font-weight: 600;
      }

      .picker { margin-bottom: 1rem; }
      .picker-title { font-size: .86rem; color: var(--muted); margin: 0 0 .45rem; }
      .scroll-row {
        display: flex;
        gap: .5rem;
        overflow-x: auto;
        padding-bottom: .3rem;
      }

      .btn {
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        border-radius: 12px;
        padding: .5rem .75rem;
        white-space: nowrap;
        cursor: pointer;
        font-size: .92rem;
      }

      .btn.active {
        background: color-mix(in oklab, var(--primary) 20%, var(--surface));
        border-color: color-mix(in oklab, var(--primary) 45%, var(--border));
        color: var(--primary-2);
        font-weight: 700;
      }

      .meta { margin: .3rem 0 .9rem; color: var(--muted); }

      .chip {
        display: inline-block;
        background: color-mix(in oklab, var(--primary) 18%, var(--surface));
        color: var(--primary-2);
        border: 1px solid color-mix(in oklab, var(--primary) 35%, var(--border));
        border-radius: 999px;
        padding: .25rem .65rem;
        font-size: .8rem;
        margin-bottom: .6rem;
      }

      .error {
        border: 1px solid color-mix(in oklab, var(--danger) 35%, transparent);
        background: color-mix(in oklab, var(--danger) 12%, var(--surface));
        color: var(--danger);
        border-radius: 10px;
        padding: .65rem .75rem;
        margin-bottom: .8rem;
      }

      .grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: .8rem; }
      .meal {
        grid-column: span 6;
        border: 1px solid var(--border);
        background: var(--surface-2);
        border-radius: 14px;
        padding: .9rem;
      }
      .meal.condimenti { grid-column: span 12; }
      .meal h3 { margin: 0 0 .55rem; color: var(--primary-2); }
      .meal ul { margin: 0; padding-left: 1.1rem; }
      .meal li { margin: .32rem 0; }

      @media (max-width: 700px) {
        .meal, .meal.condimenti { grid-column: span 12; }
        .theme-toggle { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main class="container">
      <section class="shell">
        <div class="topbar">
          <div>
            <h1>Piani Alimentari 2026</h1>
            <p class="subtitle">Consultazione veloce per paziente, settimana e giorno</p>
          </div>
          <button id="themeToggle" class="theme-toggle" type="button" aria-label="Cambia tema">🌙 Modalità notte</button>
        </div>

        <div class="picker">
          <p class="picker-title">Paziente</p>
          <div id="patientButtons" class="scroll-row"></div>
        </div>

        <div class="picker">
          <p class="picker-title">Settimana</p>
          <div id="weekButtons" class="scroll-row"></div>
        </div>

        <div class="picker">
          <p class="picker-title">Giorno</p>
          <div id="dayButtons" class="scroll-row"></div>
        </div>

        <p id="patientMeta" class="meta">Caricamento dati...</p>
        <span class="chip" id="dayChip">Giorno selezionato</span>
        <div id="error" class="error" hidden></div>
        <div class="grid" id="meals"></div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
